name: memo_lingvo
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.10.8

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  


  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # UI & Navigation
  cupertino_icons: ^1.0.2
  go_router: ^17.1.0            # Навигация (как Jetpack Navigation)
  flutter_bloc: ^9.1.1          # MVVM (State Management)
  get_it: ^9.2.1                # DI (Service Locator)

  # Data & Network
  dio: ^5.4.0                   # HTTP Client (как Retrofit/OkHttp)
  uuid: ^4.3.3
  drift: ^2.14.0                # Local DB (SQLite, как Room)
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.8.3
  connectivity_plus: ^7.0.0     # Проверка интернета
  shared_preferences: ^2.2.0    # Простые настройки (тема)

  # Utils
  equatable: ^2.0.5             # Сравнение объектов (для State)
  flutter_native_splash: ^2.3.1 # Сплеш экран
  firebase_core: ^3.15.2
  firebase_auth: ^5.5.0  # или выше до 6.x
  google_sign_in: ^6.2.1


  #Swipe
  flutter_card_swiper: ^7.0.0

  # Finder
  fuzzy: ^0.5.1

  # Files
  path_provider: ^2.1.5
  image_picker: ^1.0.7
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  share_plus: ^13.1.0

  
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6          # Кодогенерация (как KAPT/KSP)
  freezed: ^3.2.5
  json_serializable:  
  drift_dev: ^2.14.0            # Генератор для БД




flutter:
  generate: true  
  

  uses-material-design: true
  

